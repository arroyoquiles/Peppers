<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Protocolo de Péptidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EC;
    --paper-dim:#EFEADC;
    --ink:#22302B;
    --ink-soft:#5C6B62;
    --line:#DAD3C0;
    --retatrutide:#3F6E64;
    --motsc:#B98A3D;
    --tesamorelin:#4C6B8A;
    --klow:#A15A3E;
    --pause:#9A9184;
    --calc:#5B6E7D;
  }
  *{box-sizing:border-box;-webkit-text-size-adjust:100%;}
  html{color-scheme:light;background:var(--paper);}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  .wrap{
    max-width:820px;margin:0 auto;
    background:var(--paper);
    color:var(--ink);
    padding:calc(28px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    min-height:100vh;
  }
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:32px;
    margin:0 0 4px;
    letter-spacing:-.01em;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:14px;
  }
  .week-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
  }
  .week-nav button{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    background:none;
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
  }
  .week-nav button:hover{background:var(--paper-dim);}
  .week-range{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .table-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  th, td{padding:0;text-align:center;}
  col.name-col{width:172px;}
  col.gear-col{width:34px;}
  thead th{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.04em;
    color:var(--ink-soft);
    padding:12px 2px 10px;
    border-bottom:1px solid var(--line);
    font-weight:500;
  }
  thead th.day-col-th{}
  .day-letter{display:block;text-transform:uppercase;}
  .daynum{
    display:flex;
    align-items:center;
    justify-content:center;
    width:26px;height:26px;
    margin:4px auto 0;
    border-radius:50%;
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    color:var(--ink);
  }
  .daynum.today{
    background:var(--ink);
    color:var(--paper);
  }
  thead th.today-col{border-bottom:2px solid var(--ink);}
  thead th:first-child, tbody td.name-cell{text-align:left;padding-left:14px;}

  @media (max-width:480px){
    col.name-col{width:128px;}
    col.gear-col{width:26px;}
    td.name-cell{padding:10px 6px 10px 8px !important;width:128px;}
    .pname{font-size:12px;line-height:1.25;max-width:98px;}
    .dose-badge{padding:5px 8px;margin-top:5px;}
    .dose-label{font-size:7px;}
    .dose-mg, .dose-u{font-size:13px;}
    .swatch{width:6px;height:6px;margin-right:5px;}
    thead th{font-size:8px;padding:10px 1px 8px;}
    .daynum{width:22px;height:22px;font-size:13px;margin-top:3px;}
    .cell{padding:6px 1px;}
    .box{width:26px;height:26px;border-radius:6px;font-size:12px;}
    .dash{font-size:10px;}
    .paused-tag{font-size:8px;padding:1px 5px;}
    .gear-btn{width:22px;height:22px;}
    .gear-btn svg{width:11px;height:11px;}
  }
  @media (max-width:360px){
    col.name-col{width:92px;}
    col.gear-col{width:24px;}
    td.name-cell{padding:8px 5px 8px 6px !important;width:92px;}
    .box{width:23px;height:23px;}
    thead th{font-size:7.5px;}
    .daynum{width:19px;height:19px;font-size:11.5px;}
    .dose-mg, .dose-u{font-size:11.5px;}
  }

  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:last-child{border-bottom:none;}
  td.name-cell{padding:14px 10px 14px 16px;width:172px;}
  .pname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle;max-width:150px;}
  .dose-badge{
    display:flex;
    align-items:center;
    width:100%;
    box-sizing:border-box;
    margin-top:6px;
    padding:6px 12px;
    border-radius:9px;
    border:1px solid;
  }
  .dose-field{
    display:flex;
    flex-direction:column;
    flex:1;
    line-height:1.15;
  }
  .dose-field.dose-field-mg{align-items:flex-start;}
  .dose-field.dose-field-units{align-items:flex-end;}
  .dose-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:8px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .dose-mg{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:16px;
  }
  .dose-u{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:16px;
    color:var(--ink);
  }
  .dose-divider{
    width:1px;
    align-self:stretch;
    margin:0 10px;
  }
  .swatch{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    margin-right:7px;position:relative;top:-1px;
  }
  .gear-cell{vertical-align:middle;padding:4px 4px;border-left:1px solid var(--line);}
  .gear-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;height:26px;
    padding:0;
    border:none;
    background:none;
    color:var(--ink-soft);
    opacity:.5;
    cursor:pointer;
    border-radius:6px;
  }
  .gear-btn:active{opacity:1;background:var(--paper-dim);}

  .cell{padding:10px 4px;position:relative;}
  .box{
    width:30px;height:30px;
    border-radius:8px;
    border:1.5px solid var(--line);
    margin:0 auto;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    background:var(--paper);
    transition:background .12s, border-color .12s, transform .08s;
    user-select:none;
  }
  .box:active{transform:scale(0.92);}
  .box.off{
    border:none;background:none;cursor:default;
    color:var(--line);font-size:12px;
  }
  .box.checked{color:#fff;}
  .dash{color:var(--line);font-size:12px;}

  .row-paused .box:not(.off){
    cursor:not-allowed;
    opacity:.45;
    background:repeating-linear-gradient(135deg, var(--paper-dim), var(--paper-dim) 4px, #fff 4px, #fff 8px);
  }
  .row-unconfigured .box:not(.off){
    cursor:not-allowed;
    opacity:.35;
    background:var(--paper-dim);
    border-style:dashed;
  }
  .row-unconfigured .dose-mg, .row-unconfigured .dose-u{color:var(--ink-soft) !important;}
  .paused-tag{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--pause);
    border:1px solid var(--pause);
    border-radius:20px;
    padding:1px 7px;
    margin-top:3px;
  }

  .cycle-body{display:flex;gap:14px;align-items:center;}
  .dial{
    width:64px;height:64px;border-radius:50%;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .dial-inner{
    width:48px;height:48px;border-radius:50%;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .dial-day{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px;}
  .dial-of{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-soft);}
  .cycle-info{flex:1;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .cycle-info strong{color:var(--ink);font-weight:600;}
  .status-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 8px;border-radius:20px;
    display:inline-block;margin-bottom:5px;
  }

  .day-toggle-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
  .day-toggle{
    width:34px;height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    cursor:pointer;
  }
  .day-toggle.active{color:#fff;font-weight:600;}

  .calc-open-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:14px;
    padding:7px 13px;
    border-radius:20px;
    border:1px solid var(--calc);
    background:none;
    color:var(--calc);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    cursor:pointer;
  }
  .calc-open-btn:active{background:var(--calc);color:#fff;}

  .calc-target-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
  .calc-target-btn{
    padding:7px 11px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    cursor:pointer;
  }
  .calc-target-btn.active{background:var(--calc);border-color:var(--calc);color:#fff;font-weight:600;}
  .calc-result{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:16px;
    color:var(--calc);
  }
  .calc-note{font-size:11.5px;color:var(--ink-soft);margin-top:10px;line-height:1.5;}

  .controls-group{margin-top:16px;}
  .controls-group-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .field-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .field-row:last-child{border-bottom:none;}
  .field-label{font-size:13px;color:var(--ink-soft);flex-shrink:0;}
  .field-input{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .field-input input, .field-input select{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:4px 7px;
    background:var(--paper);
    color:var(--ink);
    text-align:right;
  }
  .field-input .unit-suffix{font-size:12px;color:var(--ink-soft);}
  .field-input input[type="number"]{width:56px;}
  .field-input input[type="date"]{width:126px;text-align:left;}
  .field-input select{max-width:140px;}
  .dose-preview{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:8px;
    padding:8px 11px;
    border-radius:10px;
    border:1px solid;
  }
  .dose-preview-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .dose-preview-value{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:16px;
  }
  .dose-preview-u{
    font-weight:400;
    color:var(--ink-soft);
    font-size:13px;
  }
  .vial-note{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:6px;
    line-height:1.4;
  }
  .vial-estimate-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    color:var(--pause);
  }
  .clearBtn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 9px;
    cursor:pointer;
    margin-top:10px;
    width:100%;
  }
  .clearBtn:hover{background:var(--paper-dim);color:var(--ink);}

  .continuous-note{
    font-size:12.5px;color:var(--ink-soft);line-height:1.5;
  }

  footer{
    margin-top:30px;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
  }

  .sheet-backdrop{
    position:fixed;inset:0;
    background:rgba(20,24,20,0.45);
    opacity:0;
    pointer-events:none;
    transition:opacity .28s ease;
    z-index:80;
  }
  .sheet-backdrop.open{opacity:1;pointer-events:auto;}
  .sheet-panel{
    position:fixed;left:0;right:0;bottom:0;
    max-height:85vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--paper);
    color:var(--ink);
    border-radius:20px 20px 0 0;
    transform:translateY(102%);
    transition:transform .34s cubic-bezier(.22,.68,0,1.01);
    z-index:81;
    padding:14px 18px calc(28px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 30px rgba(0,0,0,0.18);
  }
  .sheet-panel.open{transform:translateY(0);}
  .sheet-handle{
    width:36px;height:4px;border-radius:3px;
    background:var(--line);
    margin:2px auto 14px;
  }
  .sheet-top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:2px;
  }
  .sheet-close{
    border:none;background:var(--paper-dim);
    color:var(--ink-soft);
    width:28px;height:28px;border-radius:50%;
    font-size:15px;line-height:1;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Seguimiento personal</div>
    <h1>Protocolo de Péptidos</h1>
    <div class="subtitle">Marca cada dosis aplicada. Se guarda automáticamente.</div>
    <button type="button" id="calcOpenBtn" class="calc-open-btn">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="8.01" y2="10"></line><line x1="12" y1="10" x2="12.01" y2="10"></line><line x1="16" y1="10" x2="16.01" y2="10"></line><line x1="8" y1="14" x2="8.01" y2="14"></line><line x1="12" y1="14" x2="12.01" y2="14"></line><line x1="16" y1="14" x2="16.01" y2="14"></line><line x1="8" y1="18" x2="16" y2="18"></line></svg>
      Calculadora suelta
    </button>

  </header>

  <div class="card">
    <div class="table-scroll">
    <table>
      <colgroup>
        <col class="name-col">
        <col><col><col><col><col><col><col>
        <col class="gear-col">
      </colgroup>
      <thead>
        <tr>
          <th>Péptido</th>
          <th id="th0"></th><th id="th1"></th><th id="th2"></th>

          <th></th>
        </tr>
      </thead>
      <tbody id="gridBody"></tbody>
    </table>
    </div>
  </div>

  <footer>Herramienta de organización personal, no sustituye indicación médica.</footer>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet-panel" id="sheetPanel">
  <div class="sheet-handle"></div>
  <div class="sheet-top">
    <span class="pname" id="sheetTitle"></span>
    <button type="button" class="sheet-close" id="sheetClose">✕</button>
  </div>

<script>
const DAY_NAMES = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const DAY_LETTERS = ["L","M","X","J","V","S","D"];

const PEPTIDES = [
  {
    id:"reta", name:"Retatrutide", vialMg:20, defaultDoseMg:5, defaultReconMl:2, vial:"vial 20 mg", color:"var(--retatrutide)",
    doseDays:[5], // Saturday index (0=Mon)
    continuous:true
  },
  {
    id:"motsc", name:"MOTS-c", vialMg:40, defaultDoseMg:5, defaultReconMl:2, vial:"vial 40 mg", color:"var(--motsc)",
    doseDays:[0,2,4], // Lun, Mié, Vie
    activeWeeksMin:4, activeWeeksMax:6, defaultWeeks:4,
    pauseWeeksMin:4, pauseWeeksMax:6, defaultPauseWeeks:4,
    configurableWeeks:true
  },
  {
    id:"tesa", name:"Tesamorelin", vialMg:20, defaultDoseMg:1, defaultReconMl:2, vial:"vial 20 mg", color:"var(--tesamorelin)",
    doseDays:[0,1,2,3,4], // Lun-Vie
    activeWeeksMin:4, activeWeeksMax:8, defaultWeeks:4,
    pauseWeeksMin:4, pauseWeeksMax:8, defaultPauseWeeks:4,
    configurableWeeks:true
  },
  {
    id:"klow", name:"Klow", vialMg:80, defaultDoseMg:2.67, defaultReconMl:3, vial:"vial 80 mg", color:"var(--klow)",
    doseDays:[0,1,2,3,4,5,6], // diario
    activeWeeksMin:2, activeWeeksMax:4, defaultWeeks:2,
    pauseWeeksMin:2, pauseWeeksMax:4, defaultPauseWeeks:2,
    configurableWeeks:true,
    nameOptions:["Klow","GHK-Cu"]
  }
];

let settings = {}; // { motsc:{start:'2026-08-01'}, tesa:{start:'...', weeks:10}, klow:{start:'...'} }
let weekOffset = 0; // 0 = current week
let checksCache = {}; // weekIso -> checks object (in-memory source of truth for rendering)

function mondayOf(d){
  const date = new Date(d);
  const day = date.getDay(); // 0=Sun..6=Sat
  const diff = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function isoDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function fmtShort(d){ return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }

function currentWeekStart(){
  const base = mondayOf(new Date());
  return addDays(base, weekOffset*7);
}

// ---- storage helpers (localStorage, with in-memory fallback if blocked) ----
const memFallback = {};
function lsGet(key){
  try{
    const v = localStorage.getItem(key);
    return v !== null ? v : (key in memFallback ? memFallback[key] : null);
  }catch(e){
    return (key in memFallback ? memFallback[key] : null);
  }
}
function lsSet(key, value){
  memFallback[key] = value; // always keep an in-memory copy so the UI never loses state
  try{ localStorage.setItem(key, value); }catch(e){ /* storage blocked, memory copy still works */ }
}

async function loadSettings(){
  const raw = lsGet('peptide-settings');
  settings = raw ? JSON.parse(raw) : {};
}
async function saveSettings(){
  lsSet('peptide-settings', JSON.stringify(settings));
}
async function loadChecks(weekStartIso){
  const raw = lsGet('checks:'+weekStartIso);
  return raw ? JSON.parse(raw) : {};
}
async function saveChecks(weekStartIso, data){
  lsSet('checks:'+weekStartIso, JSON.stringify(data));
}
async function getChecksForWeek(weekIso){
  if(!checksCache[weekIso]){
    checksCache[weekIso] = await loadChecks(weekIso);
  }
  return checksCache[weekIso];
}

// ---- cycle math ----
function cycleStatus(p, today){
  if(p.continuous) return {known:true, active:true, continuous:true};
  const s = settings[p.id];
  if(!s || !s.start) return {known:false};
  const start = new Date(s.start+'T00:00:00');
  if(today < start) return {known:true, active:false, notStarted:true, daysUntilStart: Math.ceil((start-today)/86400000)};

  const weeks = (s.weeks && s.weeks>=p.activeWeeksMin && s.weeks<=p.activeWeeksMax) ? s.weeks : p.defaultWeeks;
  const activeLen = weeks*7;
  const pauseWeeks = (s.pauseWeeks && s.pauseWeeks>=p.pauseWeeksMin && s.pauseWeeks<=p.pauseWeeksMax) ? s.pauseWeeks : p.defaultPauseWeeks;
  const pauseLen = pauseWeeks*7;
  const cycleLen = activeLen + pauseLen;
  const elapsed = Math.floor((today - start)/86400000);
  const cycleDay = elapsed % cycleLen; // 0-indexed
  const active = cycleDay < activeLen;
  const dayInPhase = active ? cycleDay+1 : cycleDay-activeLen+1;
  const phaseLen = active ? activeLen : pauseLen;
  const daysLeftInPhase = phaseLen - dayInPhase + 1;
  const phaseStartOffset = active ? (elapsed - cycleDay) : (elapsed - cycleDay) + activeLen;
  const trueEnd = addDays(start, phaseStartOffset + phaseLen - 1);
  return {known:true, active, dayInPhase, phaseLen, daysLeftInPhase, phaseEndDate: trueEnd, cycleLen, activeLen, pauseLen};
}

function getDisplayName(p){
  const s = settings[p.id];
  return (s && s.displayName) ? s.displayName : p.name;
}

function getVialMg(p){
  const s = settings[p.id];
  return (s && s.vialMg) ? s.vialMg : p.vialMg;
}

function getReconMl(p){
  const s = settings[p.id];
  return (s && s.reconMl) ? s.reconMl : p.defaultReconMl;
}

function getDoseMgInput(p){
  const s = settings[p.id];
  return (s && s.doseMg!=null) ? s.doseMg : p.defaultDoseMg;
}

function getDoseDays(p){
  const s = settings[p.id];
  return (s && s.doseDays) ? s.doseDays : p.doseDays;
}

function computeDoseMg(p){
  return Math.round(getDoseMgInput(p)*100)/100;
}

function computeUnits(p){
  const mgPerMl = getVialMg(p) / getReconMl(p);
  const units = (getDoseMgInput(p) / mgPerMl) * 100;
  return Math.round(units*10)/10;
}

function getActiveLen(p){
  if(p.continuous) return null;
  const s = settings[p.id] || {};
  const weeks = (s.weeks && s.weeks>=p.activeWeeksMin && s.weeks<=p.activeWeeksMax) ? s.weeks : p.defaultWeeks;
  return weeks*7;
}

function getPauseWeeks(p){
  if(p.continuous) return null;
  const s = settings[p.id] || {};
  return (s.pauseWeeks && s.pauseWeeks>=p.pauseWeeksMin && s.pauseWeeks<=p.pauseWeeksMax) ? s.pauseWeeks : p.defaultPauseWeeks;
}

function monWeekdayIndex(d){
  const jsDay = d.getDay(); // 0=Sun..6=Sat
  return jsDay===0 ? 6 : jsDay-1; // 0=Mon..6=Sun, matches doseDays indexing
}

function computeVialUsage(p){
  const activeLen = getActiveLen(p);
  const doseDays = getDoseDays(p);
  const s = settings[p.id] || {};
  const doseMg = computeDoseMg(p);
  const vialMg = getVialMg(p);
  let doseCount, exact;
  if(s.start){
    const start = new Date(s.start+'T00:00:00');
    doseCount = 0;
    for(let i=0;i<activeLen;i++){
      if(doseDays.includes(monWeekdayIndex(addDays(start,i)))) doseCount++;
    }
    exact = true;
  } else {
    doseCount = activeLen * (doseDays.length/7);
    exact = false;
  }
  const totalMg = doseCount*doseMg;
  return { doseCount, totalMg, vialsNeeded: totalMg/vialMg, activeLen, exact };
}

function computeContinuousUsage(p){
  const doseMg = computeDoseMg(p);
  const vialMg = getVialMg(p);
  const doseDays = getDoseDays(p);
  const dosesPerVial = vialMg/doseMg;
  const daysPerVial = dosesPerVial * (7/doseDays.length);
  const vialsPerMonth = 30.44/daysPerVial;
  const weeklyMode = doseDays.length===1; // once a week: doses per vial = weeks per vial, no need for day math
  return { dosesPerVial, daysPerVial, vialsPerMonth, weeklyMode, weeksPerVial: dosesPerVial };
}

function dayTogglesHtml(p){
  const days = getDoseDays(p);
  let html = '<div class="controls-group"><div class="controls-group-title">Días de dosis</div><div class="day-toggle-row">';
  for(let i=0;i<7;i++){
    const active = days.includes(i);
    const style = active ? ('background:'+p.color+';border-color:'+p.color+';') : '';
    html += '<button type="button" class="day-toggle'+(active?' active':'')+'" data-pid="'+p.id+'" data-day="'+i+'" style="'+style+'">'+DAY_NAMES[i][0]+'</button>';
  }
  html += '</div></div>';
  return html;
}

// ---- rendering ----
function getTodayColIndex(){
  if(weekOffset!==0) return -1; // only highlight "today" when viewing the actual current week
  return monWeekdayIndex(new Date());
}

function renderHeader(weekStart){
  const end = addDays(weekStart,6);
  document.getElementById('weekRange').textContent = fmtShort(weekStart)+' – '+fmtShort(end)+' · '+weekStart.getFullYear();
  const todayIdx = getTodayColIndex();
  for(let i=0;i<7;i++){
    const d = addDays(weekStart,i);
    const th = document.getElementById('th'+i);
    const isToday = i===todayIdx;
    th.className = 'day-col-th'+(isToday?' today-col':'');
    th.innerHTML = '<span class="day-letter">'+DAY_LETTERS[i]+'</span><span class="daynum'+(isToday?' today':'')+'">'+d.getDate()+'</span>';
  }
}

async function renderGrid(){
  const weekStart = currentWeekStart();
  renderHeader(weekStart);
  const weekIso = isoDate(weekStart);
  const checks = await getChecksForWeek(weekIso);
  const today = new Date(); today.setHours(0,0,0,0);

  const tbody = document.getElementById('gridBody');
  tbody.innerHTML = '';
  const todayIdx = getTodayColIndex();

  PEPTIDES.forEach(p=>{
    const status = cycleStatus(p, today);
    const isPausedThisWeek = status.known && !status.continuous && !status.active && !status.notStarted;
    const isUnconfigured = !p.continuous && !status.known;
    const isInactive = isPausedThisWeek || isUnconfigured;
    const doseDays = getDoseDays(p);

    const tr = document.createElement('tr');
    if(isPausedThisWeek) tr.classList.add('row-paused');
    if(isUnconfigured) tr.classList.add('row-unconfigured');

    const nameTd = document.createElement('td');
    nameTd.className='name-cell';

      + '<div class="dose-badge" style="border-color:'+p.color+'33;background:'+p.color+'14;">'
        + '<div class="dose-field dose-field-mg"><span class="dose-label">mg</span><span class="dose-mg" style="color:'+p.color+'">'+(isUnconfigured?'--':computeDoseMg(p))+'</span></div>'
        + '<div class="dose-divider" style="background:'+p.color+'33;"></div>'
        + '<div class="dose-field dose-field-units"><span class="dose-label">unidades</span><span class="dose-u">'+(isUnconfigured?'--':computeUnits(p))+'</span></div>'
      + '</div>'
      + (isPausedThisWeek ? '<div class="paused-tag">En pausa</div>' : '')
      + (isUnconfigured ? '<div class="paused-tag">Sin fecha de inicio</div>' : '');
    tr.appendChild(nameTd);

    for(let i=0;i<7;i++){
      const td = document.createElement('td');
      td.className='cell day-col'+(i===todayIdx?' today-col':'');
      if(doseDays.includes(i)){
        const key = p.id+':'+i;
        const box = document.createElement('div');

        if(isInactive){
          box.textContent='';

          if(checks[key]){
            box.classList.add('checked');
            box.style.background = p.color;
            box.style.borderColor = p.color;
            box.textContent='✓';
          }
          box.addEventListener('click', ()=>{
            checks[key] = !checks[key];
            saveChecks(weekIso, checks);
            renderGrid();
          });
        }
        td.appendChild(box);
      } else {
        const span = document.createElement('span');
        span.className='dash';
        span.textContent='–';
        td.appendChild(span);
      }
      tr.appendChild(td);
    }

    const gearTd = document.createElement('td');

function buildPeptideCardHtml(p){
  const today = new Date(); today.setHours(0,0,0,0);

  const doseGroup = '<div class="controls-group"><div class="controls-group-title">Cálculo de dosis</div>'
    + '<div class="field-row"><span class="field-label">Vial</span><span class="field-input"><input type="number" step="1" min="1" data-pid="'+p.id+'" class="vialInput" value="'+getVialMg(p)+'"><span class="unit-suffix">mg</span></span></div>'
    + '<div class="field-row"><span class="field-label">Reconstituido con</span><span class="field-input"><input type="number" step="0.5" min="0.5" data-pid="'+p.id+'" class="reconInput" value="'+getReconMl(p)+'"><span class="unit-suffix">ml</span></span></div>'
    + '<div class="field-row"><span class="field-label">mg por dosis</span><span class="field-input"><input type="number" step="0.01" min="0.01" data-pid="'+p.id+'" class="mgInput" value="'+getDoseMgInput(p)+'"><span class="unit-suffix">mg</span></span></div>'
    + '<div class="dose-preview" style="background:'+p.color+'14;border-color:'+p.color+'33;">'
      + '<span class="dose-preview-label">Debes cargar en la jeringa</span>'
      + '<span class="dose-preview-value" style="color:'+p.color+'">'+computeUnits(p)+' u <span class="dose-preview-u">· '+computeDoseMg(p)+' mg</span></span>'
    + '</div>'
    + '</div>';

  if(p.continuous){
    const cu = computeContinuousUsage(p);
    const durationText = cu.weeklyMode
      ? '≈ '+cu.weeksPerVial.toFixed(1)+' semanas'
      : '≈ '+Math.round(cu.daysPerVial)+' días';
    const noteText = cu.weeklyMode
      ? '≈ '+cu.dosesPerVial.toFixed(1)+' dosis por vial (1 dosis por semana)'
      : '≈ '+cu.dosesPerVial.toFixed(1)+' dosis por vial · ≈ '+cu.vialsPerMonth.toFixed(2)+' viales al mes';
    return '<div class="continuous-note">Uso continuo, sin cut-off. Aplica los días que marques abajo, indefinidamente.</div>'
      + dayTogglesHtml(p)
      + doseGroup
      + '<div class="controls-group"><div class="controls-group-title">Consumo de viales</div>'
        + '<div class="dose-preview" style="background:'+p.color+'14;border-color:'+p.color+'33;">'
          + '<span class="dose-preview-label">Un vial te dura</span>'
          + '<span class="dose-preview-value" style="color:'+p.color+'">'+durationText+'</span>'
        + '</div>'
        + '<div class="vial-note">'+noteText+'</div>'
      + '</div>';
  }

  const s = settings[p.id] || {};
  const status = cycleStatus(p, today);
  let body = '';

  if(status.known && !status.notStarted){
    const pct = status.active ? (status.dayInPhase/status.activeLen) : (status.dayInPhase/status.pauseLen);
    const deg = Math.round(pct*360);
    const dialColor = status.active ? p.color : 'var(--pause)';
    body += '<div class="cycle-body">'
      + '<div class="dial" style="background:conic-gradient('+dialColor+' '+deg+'deg, var(--paper-dim) '+deg+'deg)">'
      + '<div class="dial-inner"><div class="dial-day">'+status.dayInPhase+'</div><div class="dial-of">de '+(status.active?status.activeLen:status.pauseLen)+'</div></div>'
      + '</div>'
      + '<div class="cycle-info">'
      + '<span class="status-pill" style="background:'+(status.active?p.color:'var(--pause)')+';color:#fff">'+(status.active?'Activo':'Pausa')+'</span><br>'
      + (status.active
          ? 'Quedan <strong>'+status.daysLeftInPhase+' días</strong> de fase activa.<br>Termina el <strong>'+fmtShort(status.phaseEndDate)+'</strong>, luego inicia el cut-off de '+status.pauseLen+' días.'
          : 'Quedan <strong>'+status.daysLeftInPhase+' días</strong> de cut-off.<br>Reinicia dosis el <strong>'+fmtShort(addDays(status.phaseEndDate,1))+'</strong>.')
      + '</div></div>';
  } else if(status.notStarted){
    body += '<div class="continuous-note">Inicia en '+status.daysUntilStart+' día(s), el '+fmtShort(new Date(s.start+'T00:00:00'))+'.</div>';
  } else {
    body += '<div class="continuous-note">Ingresa tu fecha de inicio para calcular el ciclo y el cut-off automáticamente.</div>';
  }

  let cycleGroup = '<div class="controls-group"><div class="controls-group-title">Ciclo</div>'
    + '<div class="field-row"><span class="field-label">Inicio</span><span class="field-input"><input type="date" data-pid="'+p.id+'" class="startInput" value="'+(s.start||'')+'"></span></div>';
  {
    let opts = '';
    for(let w=p.activeWeeksMin; w<=p.activeWeeksMax; w++){
      opts += '<option value="'+w+'" '+((s.weeks||p.defaultWeeks)===w?'selected':'')+'>'+w+' semanas</option>';
    }
    cycleGroup += '<div class="field-row"><span class="field-label">Duración activa</span><span class="field-input"><select data-pid="'+p.id+'" class="weeksInput">'+opts+'</select></span></div>';
  }
  {
    let opts = '';
    for(let w=p.pauseWeeksMin; w<=p.pauseWeeksMax; w++){
      opts += '<option value="'+w+'" '+((s.pauseWeeks||p.defaultPauseWeeks)===w?'selected':'')+'>'+w+' semanas</option>';
    }
    cycleGroup += '<div class="field-row"><span class="field-label">Cut-off (pausa)</span><span class="field-input"><select data-pid="'+p.id+'" class="pauseWeeksInput">'+opts+'</select></span></div>';
  }
  if(p.nameOptions){
    let opts = '';
    p.nameOptions.forEach(n=>{
      opts += '<option value="'+n+'" '+(getDisplayName(p)===n?'selected':'')+'>'+n+'</option>';
    });
    cycleGroup += '<div class="field-row"><span class="field-label">Nombre</span><span class="field-input"><select data-pid="'+p.id+'" class="nameInput">'+opts+'</select></span></div>';
  }
  cycleGroup += '</div>';
  if(s.start){
    cycleGroup += '<button type="button" class="clearBtn" data-pid="'+p.id+'">Quitar fecha de inicio</button>';
  }

  const vu = computeVialUsage(p);
  const vialGroup = '<div class="controls-group"><div class="controls-group-title">Viales para el ciclo</div>'
    + '<div class="dose-preview" style="background:'+p.color+'14;border-color:'+p.color+'33;">'
      + '<span class="dose-preview-label">Necesitas</span>'
      + '<span class="dose-preview-value" style="color:'+p.color+'">≈ '+vu.vialsNeeded.toFixed(2)+' viales</span>'
    + '</div>'
    + '<div class="vial-note">'+vu.doseCount+' dosis · '+vu.totalMg.toFixed(1)+' mg totales en '+vu.activeLen+' días'
      + (vu.exact ? '' : ' <span class="vial-estimate-tag">(estimado, sin fecha de inicio)</span>')
    + '</div></div>';

  return body + dayTogglesHtml(p) + doseGroup + vialGroup + cycleGroup;
}

// ---- standalone calculator (scratch pad, never touches peptide settings) ----
let calcState = { target:'mg', vial:20, water:2, units:50, mg:5 };

async function loadCalcState(){
  const raw = lsGet('calc-scratch');
  if(raw){
    try{ calcState = Object.assign(calcState, JSON.parse(raw)); }catch(e){}
  }
}
function saveCalcState(){
  lsSet('calc-scratch', JSON.stringify(calcState));
}

function recalcCalc(){
  const { target, vial, water, units, mg } = calcState;
  if(target==='mg'){
    if(water>0) calcState.mg = Math.round((vial/water)*(units/100)*100)/100;
  } else if(target==='units'){
    if(vial>0) calcState.units = Math.round((mg*water*100/vial)*10)/10;
  } else if(target==='vial'){
    if(units>0) calcState.vial = Math.round((mg*water*100/units)*100)/100;
  } else if(target==='water'){
    if(mg>0) calcState.water = Math.round((vial*units/(100*mg))*100)/100;
  }
}

function calcFieldRow(field, label, suffix){
  const isTarget = calcState.target===field;
  const val = calcState[field];
  if(isTarget){
    return '<div class="field-row"><span class="field-label">'+label+'</span><span class="calc-result">'+val+(suffix?' '+suffix:'')+'</span></div>';
  }
  return '<div class="field-row"><span class="field-label">'+label+'</span><span class="field-input"><input type="number" step="0.01" min="0" class="calcInput" data-field="'+field+'" value="'+val+'">'+(suffix?'<span class="unit-suffix">'+suffix+'</span>':'')+'</span></div>';
}

function buildCalcHtml(){
  recalcCalc();
  return '<div class="continuous-note">Pizarra de cálculo suelta — no toca ni guarda nada de tus péptidos. Elige qué quieres que te calcule, y llena los otros tres valores.</div>'
    + '<div class="controls-group"><div class="controls-group-title">¿Qué quieres calcular?</div>'
      + '<div class="calc-target-row">'
        + '<button type="button" class="calc-target-btn'+(calcState.target==='vial'?' active':'')+'" data-field="vial">Vial (mg)</button>'
        + '<button type="button" class="calc-target-btn'+(calcState.target==='water'?' active':'')+'" data-field="water">Agua (ml)</button>'
        + '<button type="button" class="calc-target-btn'+(calcState.target==='units'?' active':'')+'" data-field="units">Unidades</button>'
        + '<button type="button" class="calc-target-btn'+(calcState.target==='mg'?' active':'')+'" data-field="mg">mg por dosis</button>'
      + '</div></div>'
    + '<div class="controls-group"><div class="controls-group-title">Valores</div>'
      + calcFieldRow('vial','Vial','mg')
      + calcFieldRow('water','Agua (reconstituido con)','ml')
      + calcFieldRow('units','Unidades','')
      + calcFieldRow('mg','mg por dosis','mg')
      + '</div>'
    + '<div class="calc-note">Fórmula: mg por dosis = (vial ÷ agua) × (unidades ÷ 100). Cambia cualquier valor y el resaltado en azul se recalcula solo.</div>';
}

function attachCalcListeners(){
  sheetContent.querySelectorAll('.calc-target-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      calcState.target = btn.dataset.field;
      saveCalcState();
      refreshSheet();
    });
  });
  sheetContent.querySelectorAll('.calcInput').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const field = inp.dataset.field;
      const val = parseFloat(inp.value);
      calcState[field] = isNaN(val) ? 0 : val;
      saveCalcState();
      recalcCalc();
      // update just the result display live without losing input focus
      const resultEl = sheetContent.querySelector('.calc-result');
      if(resultEl) resultEl.textContent = calcState[calcState.target] + (calcState.target==='vial'||calcState.target==='mg' ? ' mg' : calcState.target==='water' ? ' ml' : '');
    });
    inp.addEventListener('change', ()=>{ saveCalcState(); refreshSheet(); });
  });
}

let openPid = null;
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sheetPanel = document.getElementById('sheetPanel');
const sheetContent = document.getElementById('sheetContent');

function refreshSheet(){
  if(!openPid) return;
  if(openPid==='calc'){
    sheetTitle.textContent = 'Calculadora suelta';
    sheetContent.innerHTML = buildCalcHtml();
    attachCalcListeners();
    return;
  }
  const p = PEPTIDES.find(x=>x.id===openPid);
  if(!p) return;
  sheetTitle.textContent = getDisplayName(p);
  sheetContent.innerHTML = buildPeptideCardHtml(p);
  attachSheetListeners();
}

function openSheet(pid){
  openPid = pid;
  refreshSheet();
  sheetBackdrop.classList.add('open');
  sheetPanel.classList.add('open');
}

function closeSheet(){
  sheetBackdrop.classList.remove('open');
  sheetPanel.classList.remove('open');

}

      const pid = e.target.dataset.pid;
      settings[pid] = settings[pid] || {};
      settings[pid].weeks = parseInt(e.target.value,10);
      await saveSettings();
      refreshSheet();
      renderGrid();
    });
  });
  sheetContent.querySelectorAll('.pauseWeeksInput').forEach(sel=>{
    sel.addEventListener('change', async (e)=>{
      const pid = e.target.dataset.pid;
      settings[pid] = settings[pid] || {};
      settings[pid].pauseWeeks = parseInt(e.target.value,10);
      await saveSettings();
      refreshSheet();
      renderGrid();
    });
  });
  sheetContent.querySelectorAll('.nameInput').forEach(sel=>{
    sel.addEventListener('change', async (e)=>{
      const pid = e.target.dataset.pid;
      settings[pid] = settings[pid] || {};
      settings[pid].displayName = e.target.value;
      await saveSettings();
      refreshSheet();
      renderGrid();
    });
  });
}

// delegated: gear icon opens the sheet for its peptide (works even after grid re-renders)
document.getElementById('gridBody').addEventListener('click', (e)=>{
  const btn = e.target.closest('.gear-btn');
  if(btn) openSheet(btn.dataset.pid);
});

document.getElementById('prevWeek').addEventListener('click', ()=>{ weekOffset--; renderGrid(); });
document.getElementById('nextWeek').addEventListener('click', ()=>{ weekOffset++; renderGrid(); });

(async function init(){
  await loadSettings();
  await loadCalcState();
  renderGrid();
})();
</script>
</body>
</html>
